# Publishes both images to GHCR, and the jd CLI for each platform to the GitHub
# release, when a version tag is pushed: git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: justdeploy
            context: .
          - name: justdeploy-builder
            context: builder
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # ponytail: arm64 is built under QEMU, which is slow for the Rust image; switch
      # to native arm runners if release builds get too long.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  cli:
    name: jd for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, file: jd-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, file: jd-linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, file: jd-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, file: jd-macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: jd-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: cli
      - name: Name the binary for its platform
        shell: bash
        run: cp "cli/target/${{ matrix.target }}/release/jd${{ runner.os == 'Windows' && '.exe' || '' }}" "${{ matrix.file }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
