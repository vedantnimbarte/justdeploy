name: justdeploy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: justdeploy
      POSTGRES_PASSWORD: ${JD_DB_PASSWORD:-justdeploy}
      POSTGRES_DB: justdeploy
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justdeploy"]
      interval: 5s
      timeout: 3s
      retries: 10

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=jd-proxy
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

volumes:
  postgres:

networks:
  proxy:
    name: jd-proxy
