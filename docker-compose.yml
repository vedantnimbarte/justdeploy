# justdeploy on one server: the control plane, its Postgres, and Traefik.
# deploy/install.sh writes the .env this file reads. For HTTPS, add
# docker-compose.tls.yml (see the README).
name: justdeploy

services:
  justdeploy:
    image: ghcr.io/vedantnimbarte/justdeploy:${JD_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://justdeploy:${JD_DB_PASSWORD:-justdeploy}@postgres:5432/justdeploy
      JD_MASTER_KEY: ${JD_MASTER_KEY:-}
      JD_BASE_DOMAIN: ${JD_BASE_DOMAIN:-localhost}
      JD_PUBLIC_URL: ${JD_PUBLIC_URL:-http://localhost:8080}
      JD_ACME_EMAIL: ${JD_ACME_EMAIL:-}
      JD_BUILDER_IMAGE: ${JD_BUILDER_IMAGE:-ghcr.io/vedantnimbarte/justdeploy-builder:latest}
      JD_DEPLOY_WORKERS: ${JD_DEPLOY_WORKERS:-2}
      JD_ADVERTISE_ADDR: ${JD_ADVERTISE_ADDR:-}
    ports:
      - "${JD_PORT:-8080}:8080"
    volumes:
      # justdeploy runs containers on this host's Docker. Access to this socket is
      # root on the host: keep the dashboard behind a strong password.
      - /var/run/docker.sock:/var/run/docker.sock
      - backups:/backups

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: justdeploy
      POSTGRES_PASSWORD: ${JD_DB_PASSWORD:-justdeploy}
      POSTGRES_DB: justdeploy
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justdeploy"]
      interval: 5s
      timeout: 3s
      retries: 10

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=jd-proxy
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=jd-mesh
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

volumes:
  postgres:
  backups:

networks:
  proxy:
    name: jd-proxy
