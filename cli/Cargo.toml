[package]
name = "justdeploy-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deploy, follow logs, edit variables and run commands on a justdeploy server"

[[bin]]
name = "jd"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "warn"

[profile.release]
strip = true
lto = true
